# Auth rules shared by every model: anyone with the API key can read
# (public scoreboard), only the "admin" Cognito group can write.

# A roster entry. A player is just initials; their scores live in GameScore.
# core: one of the regulars shown on the main table (a game counts there only
#   when every core player played). Non-core players are guests.
# hidden: a test player. Never shown publicly; plays involving it never count.
type Player
  @model
  @auth(
    rules: [
      { allow: public, provider: apiKey, operations: [read] }
      { allow: groups, groups: ["admin"] }
    ]
  ) {
  id: ID!
  initials: String!
  core: Boolean
  hidden: Boolean
  # Full name, for admins to tell players apart. Field-level auth: only the
  # "admin" group can read or write it — the public API key never sees it, so
  # public queries must not request this field. The site displays initials.
  name: String @auth(rules: [{ allow: groups, groups: ["admin"] }])
}

# A game (one row in the scoreboard).
# baselinePlays: plays before Play records existed, estimated from the game's
#   win total at the time (each three-player game produced exactly one win).
#   The Played count is baselinePlays + this game's counted Plays.
type Game
  @model
  @auth(
    rules: [
      { allow: public, provider: apiKey, operations: [read] }
      { allow: groups, groups: ["admin"] }
    ]
  ) {
  id: ID!
  name: String!
  baselinePlays: Float
  # BoardGameGeek id (links the game name to its BGG page) and box-art image URL
  # (shown as a thumbnail; any https image URL works).
  bggId: Int
  imageUrl: String
  # Optional per-player details to collect when recording this game, as JSON:
  # [{ "key": "points", "label": "Victory points", "type": "number" },
  #  { "key": "faction", "label": "Faction", "type": "text", "options": [...] }]
  scoreFields: AWSJSON
}

# One player's score in one game (a single cell of the board). Adding a player
# or a game fans out a GameScore row per pairing, starting at 0.
type GameScore
  @model
  @auth(
    rules: [
      { allow: public, provider: apiKey, operations: [read] }
      { allow: groups, groups: ["admin"] }
    ]
  ) {
  id: ID!
  gameId: ID!
  playerId: ID!
  # Float (not Int) on purpose: a draw splits the win, so half points like 1.5
  # are valid and exist in the migrated data. Do not change to Int.
  score: Float!
}

# Append-only ledger: one immutable row per score change (each +/- click, plus
# a baseline row per cell written at migration time). GameScore.score stays the
# fast "current total"; ScoreEvent is the source of truth for history, enabling
# wins-over-time graphs. The automatic createdAt records WHEN each change
# happened — order a player's events by createdAt and keep a running sum of
# delta to reconstruct their score at any point in time.
type ScoreEvent
  @model
  @auth(
    rules: [
      { allow: public, provider: apiKey, operations: [read] }
      { allow: groups, groups: ["admin"] }
    ]
  ) {
  id: ID!
  gameId: ID!
  playerId: ID!
  delta: Float!
  # Denormalized labels snapshotted at write time so history survives a player
  # or game being renamed or deleted (the id references may dangle, but a graph
  # can still label the line).
  playerInitials: String
  gameName: String
  # Cognito username of the admin who recorded this change. The migration
  # baseline rows use "migration".
  recordedBy: String
  # Soft delete: set true to exclude a bogus event from graphs without hard
  # deleting it (the row, and its audit trail, are preserved). Unset/false means
  # active. Never hard-delete events — void them.
  voided: Boolean
  # The Play this win came from (unset for manual +/- corrections, backfill and
  # migration rows).
  playId: ID
  # When the game was actually played, if different from createdAt (a Play
  # recorded after the fact). Trends uses occurredAt ?? createdAt.
  occurredAt: AWSDateTime
}

# One recorded game: who played and who won. A play "counts" on the main table
# only when every core player took part and no hidden (test) player did; then
# each core winner gets an equal share of 1 win (ScoreEvents with playId).
# Plays that don't count are still kept for the All games view and stats.
# Void, never delete (voiding a counted play also voids its ScoreEvents).
type Play
  @model
  @auth(
    rules: [
      { allow: public, provider: apiKey, operations: [read] }
      { allow: groups, groups: ["admin"] }
    ]
  ) {
  id: ID!
  gameId: ID!
  gameName: String
  playedAt: AWSDateTime!
  playerIds: [ID!]!
  winnerIds: [ID!]!
  counted: Boolean
  test: Boolean
  recordedBy: String
  voided: Boolean
  # Optional per-player details for this game, keyed by player id then by the
  # game's scoreFields keys, as JSON: { "<playerId>": { "points": 10 } }.
  details: AWSJSON
}

# Atomic, server-side increment of a single GameScore cell.
# Backed by a custom DynamoDB UpdateItem ("ADD") resolver so concurrent +/-
# edits no longer clobber each other (the old client-side read-modify-write
# was racy).
#
# @aws_cognito_user_pools is required because the API's default auth mode is
# API_KEY: without an explicit directive AppSync would only allow this field
# via the API key, and the client calls it with the user pool. cognito_groups
# restricts it to admins at the AppSync layer; the resolver VTL re-checks the
# same group as defense in depth.
#
# delta is Float so a future "draw / +0.5" button needs no schema change; the
# +/- buttons currently send ±1.
type Mutation {
  incrementScore(id: ID!, delta: Float!): GameScore
    @aws_cognito_user_pools(cognito_groups: ["admin"])
}
