# Auth rules shared by every model: anyone with the API key can read
# (public scoreboard), only the "admin" Cognito group can write.

# ---------------------------------------------------------------------------
# PHASE A (transitional): the legacy Score model is kept ALONGSIDE the new
# Player/Game/GameScore models so the migration script can read existing data
# before Phase B deletes it. Do not remove Score until migration is verified.
# ---------------------------------------------------------------------------
type Score
  @model
  @auth(
    rules: [
      { allow: public, provider: apiKey, operations: [read] }
      { allow: groups, groups: ["admin"] }
    ]
  ) {
  id: ID!
  game: String!
  sgScore: Float!
  niScore: Float!
  mgScore: Float!
  fourScore: Float
}

# A roster entry. A player is just initials; their scores live in GameScore.
type Player
  @model
  @auth(
    rules: [
      { allow: public, provider: apiKey, operations: [read] }
      { allow: groups, groups: ["admin"] }
    ]
  ) {
  id: ID!
  initials: String!
}

# A game (one row in the scoreboard).
type Game
  @model
  @auth(
    rules: [
      { allow: public, provider: apiKey, operations: [read] }
      { allow: groups, groups: ["admin"] }
    ]
  ) {
  id: ID!
  name: String!
}

# One player's score in one game (a single cell of the board). Adding a player
# or a game fans out a GameScore row per pairing, starting at 0.
type GameScore
  @model
  @auth(
    rules: [
      { allow: public, provider: apiKey, operations: [read] }
      { allow: groups, groups: ["admin"] }
    ]
  ) {
  id: ID!
  gameId: ID!
  playerId: ID!
  # Float (not Int) on purpose: a draw splits the win, so half points like 1.5
  # are valid and exist in the migrated data. Do not change to Int.
  score: Float!
}

# Append-only ledger: one immutable row per score change (each +/- click, plus
# a baseline row per cell written at migration time). GameScore.score stays the
# fast "current total"; ScoreEvent is the source of truth for history, enabling
# wins-over-time graphs. The automatic createdAt records WHEN each change
# happened — order a player's events by createdAt and keep a running sum of
# delta to reconstruct their score at any point in time.
type ScoreEvent
  @model
  @auth(
    rules: [
      { allow: public, provider: apiKey, operations: [read] }
      { allow: groups, groups: ["admin"] }
    ]
  ) {
  id: ID!
  gameId: ID!
  playerId: ID!
  delta: Float!
  # Denormalized labels snapshotted at write time so history survives a player
  # or game being renamed or deleted (the id references may dangle, but a graph
  # can still label the line).
  playerInitials: String
  gameName: String
  # Cognito username of the admin who recorded this change. The migration
  # baseline rows use "migration".
  recordedBy: String
  # Soft delete: set true to exclude a bogus event from graphs without hard
  # deleting it (the row, and its audit trail, are preserved). Unset/false means
  # active. Never hard-delete events — void them.
  voided: Boolean
}

# Atomic, server-side increment of a single GameScore cell.
# Backed by a custom DynamoDB UpdateItem ("ADD") resolver so concurrent +/-
# edits no longer clobber each other (the old client-side read-modify-write
# was racy).
#
# @aws_cognito_user_pools is required because the API's default auth mode is
# API_KEY: without an explicit directive AppSync would only allow this field
# via the API key, and the client calls it with the user pool. cognito_groups
# restricts it to admins at the AppSync layer; the resolver VTL re-checks the
# same group as defense in depth.
#
# delta is Float so a future "draw / +0.5" button needs no schema change; the
# +/- buttons currently send ±1.
type Mutation {
  incrementScore(id: ID!, delta: Float!): GameScore
    @aws_cognito_user_pools(cognito_groups: ["admin"])
}
